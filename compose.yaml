services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: decompo-xor:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Groq__ApiKey: ${Groq__ApiKey:?Set Groq__ApiKey in .env}
      Openrouter__ApiKey: ${Openrouter__ApiKey:?Set Openrouter__ApiKey in .env}
      Pipeline__InputFolder: /app/Input/Project1